version: '3.8'

services:
  mariadb:
    image: mariadb:11
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: uli_db
      MYSQL_USER: uli_user
      MYSQL_PASSWORD: uli_password
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "uli_user", "-puli_password"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: always
    networks:
      - uli_network

  app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    depends_on:
      mariadb:
        condition: service_healthy
    env_file:
      - .env
    volumes:
      - ./app:/app/app
      - uploads_data:/app/uploads
    restart: always
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1
    networks:
      - uli_network

networks:
  uli_network:
    driver: bridge

volumes:
  mariadb_data:
  uploads_data:
