<!DOCTYPE html>
<html lang="en" data-bs-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}AI Underwriting Platform{% endblock %} | ULI</title>
    <!-- Google Fonts: Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <!-- Bootstrap 5.3 CSS CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Bootstrap Icons CDN -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css" rel="stylesheet">
    <!-- Custom metallic CSS -->
    <link rel="stylesheet" href="/static/css/metallic.css">
    {% block extra_head %}{% endblock %}
</head>
<body>
<div class="wrapper">
    <!-- Sidebar -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-brand">
            <div class="brand-logo"><i class="bi bi-robot"></i></div>
            <div class="brand-name">ULI Platform<br><small style="font-size:10px;color:var(--text-secondary);font-weight:normal">AI Underwriting</small></div>
        </div>
        <div class="sidebar-nav">
            <div class="nav-section-label">Main</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="/" class="nav-link {% if request.url.path == '/' %}active{% endif %}">
                        <i class="bi bi-speedometer2"></i> Dashboard
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/app/new" class="nav-link {% if '/app/new' in request.url.path %}active{% endif %}">
                        <i class="bi bi-plus-circle"></i> New Application
                    </a>
                </li>
            </ul>
            <div class="nav-section-label">Analytics</div>
            <ul class="nav flex-column">
                <li class="nav-item">
                    <a href="/app/simulator" class="nav-link {% if '/simulator' in request.url.path %}active{% endif %}">
                        <i class="bi bi-sliders"></i> Digital Twin
                    </a>
                </li>
                <li class="nav-item">
                    <a href="/app/observability" class="nav-link {% if '/observability' in request.url.path %}active{% endif %}">
                        <i class="bi bi-graph-up"></i> AI Observability
                    </a>
                </li>
            </ul>
        </div>
        <div class="sidebar-footer">
            v1.0.0 | <span style="color:var(--color-success)">● System Online</span>
        </div>
    </nav>
    <!-- Main Content -->
    <main class="main-content" id="mainContent">
        <!-- Mobile header -->
        <div class="mobile-header d-md-none">
            <button class="btn btn-dark" onclick="toggleSidebar()"><i class="bi bi-list"></i></button>
            <span class="brand-name ms-3">ULI Platform</span>
        </div>
        {% block content %}{% endblock %}
    </main>
</div>
<!-- Toast container -->
<div class="toast-container position-fixed bottom-0 end-0 p-3" id="toastContainer"></div>
<!-- Scripts -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="/static/js/charts.js"></script>
{% block extra_scripts %}{% endblock %}
<script>
function toggleSidebar() {
    document.getElementById('sidebar').classList.toggle('open');
}
</script>
</body>
</html>
